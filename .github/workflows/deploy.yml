name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        id: deploy_attempt_1
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "🚀 Starting automated deployment on VPS..."
            cd /var/www/email-system
            
            # Ensure swap exists to prevent memory spikes from crashing the VPS
            if [ ! -f /swapfile ] && [ $(id -u) -eq 0 ]; then
              echo "Creating 2GB swapfile..."
              fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile || true
            fi
            
            # Fetch and align with latest origin/main
            git fetch origin main
            git reset --hard origin/main
            
            # Install any new dependencies
            pnpm install
            
            # Build Frontend A (Vite SPA) with memory limit & low CPU priority
            echo "📦 Building Frontend A..."
            NODE_OPTIONS="--max-old-space-size=1536" nice -n 19 pnpm --dir web build
            
            # Build Next.js Backend with memory limit & low CPU priority
            echo "⚡ Generating Prisma & Building Next.js..."
            cd /var/www/email-system/nexus-outbound
            npx prisma generate
            NODE_OPTIONS="--max-old-space-size=1536" nice -n 19 npx next build
            cd /var/www/email-system
            
            # Zero-downtime PM2 reload
            echo "🔄 Reloading PM2 processes..."
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js --update-env
            
            echo "✅ Deployment successful! Live at https://tbmoutreach.tech"

      - name: Retry Deploy via SSH (if first attempt timed out)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 90s
          command_timeout: 10m
          script: |
            echo "🚀 Retrying automated deployment on VPS..."
            cd /var/www/email-system
            
            git fetch origin main
            git reset --hard origin/main
            pnpm install
            
            echo "📦 Building Frontend A..."
            NODE_OPTIONS="--max-old-space-size=1536" nice -n 19 pnpm --dir web build
            
            echo "⚡ Generating Prisma & Building Next.js..."
            cd /var/www/email-system/nexus-outbound
            npx prisma generate
            NODE_OPTIONS="--max-old-space-size=1536" nice -n 19 npx next build
            cd /var/www/email-system
            
            echo "🔄 Reloading PM2 processes..."
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js --update-env
            
            echo "✅ Deployment successful! Live at https://tbmoutreach.tech"
