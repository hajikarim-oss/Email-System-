name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment on VPS..."
            cd /var/www/email-system
            
            # Pull latest changes from GitHub
            git pull origin main
            
            # Install any new dependencies
            pnpm install
            
            # Build Frontend A (Vite SPA)
            echo "📦 Building Frontend A..."
            pnpm --dir web build
            
            # Build Next.js Backend
            echo "⚡ Generating Prisma & Building Next.js..."
            cd /var/www/email-system/nexus-outbound
            npx prisma generate
            npx next build
            cd /var/www/email-system
            
            # Zero-downtime PM2 reload
            echo "🔄 Reloading PM2 processes..."
            pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
            
            echo "✅ Deployment successful! Live at https://tbmoutreach.tech"
