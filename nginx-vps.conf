# ==============================================================================
# NGINX PRODUCTION CONFIGURATION FOR 4GB RAM VPS
# Place in: /etc/nginx/sites-available/email-system
# Symlink to: /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limiting zones: protect webhook receiver, general API, and auth endpoints
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# 1-second buffer micro-cache for live telemetry (keeps analytics synchronized while preventing CPU spikes)
proxy_cache_path /tmp/nginx_telemetry_cache levels=1:2 keys_zone=telemetry_cache:10m max_size=50m inactive=1m use_temp_path=off;

# Upstream Next.js application (nexus-outbound)
upstream nexus_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Upstream Root Node API
upstream root_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tbmoutreach.tech www.tbmoutreach.tech;

    # Enterprise Security Headers (OWASP Recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum client request body (for CSV lead imports, set to 25MB)
    client_max_body_size 25M;

    # Gzip Compression to minimize bandwidth and latency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Serve Vite Static Dashboard (web/dist) directly from Nginx (Takes ~10MB RAM)
    root /var/www/email-system/web/dist;
    index index.html;

    # Static Assets Cache (Immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA History Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 2. Next.js App (nexus-outbound) Dashboard & API
    # Proxies Next.js routes
    location /nexus/ {
        proxy_pass http://nexus_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # 3. Webhook Receiver: High throughput with burst buffering
    location /api/webhooks/smartlead {
        limit_req zone=webhook_limit burst=50 nodelay;

        proxy_pass http://root_api/api/webhooks/smartlead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live streaming/fast response
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # 4. Inngest Function Queue Endpoint
    location /api/inngest {
        proxy_pass http://nexus_backend/api/inngest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 5. Live Telemetry & Analytics (1-Second Buffer Load, Always Synced)
    location /api/analytics/ {
        proxy_cache telemetry_cache;
        proxy_cache_valid 200 1s; # 1-second buffer load micro-cache
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://root_api/api/analytics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 6. Authentication Rate Limiting (Prevents credential stuffing & brute-force)
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://root_api/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 7. General API Routing (Proxied to Root API)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://root_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
